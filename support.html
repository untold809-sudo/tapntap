<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Welcome to tapntap</title>
	<style>
		:root { font-family: Arial, sans-serif; color: #172554; background: #e0f2fe; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
		main { width: min(90%, 560px); padding: 3.5rem 2rem; text-align: center; background: white; border-radius: 24px; box-shadow: 0 16px 40px #1e40af26; }
		h1 { margin: 0 0 1rem; font-size: clamp(2.3rem, 8vw, 4rem); }
		p { margin: 0 0 2rem; color: #475569; font-size: 1.1rem; }
		a { display: inline-block; padding: .85rem 1.5rem; border-radius: 999px; background: #2563eb; color: white; text-decoration: none; font-weight: 700; }
		a:hover { background: #1d4ed8; }
	</style>
</head>
<body>
	<main>
		<h1>Welcome to tapntap</h1>
		<p>Simple, quick, and ready when you are.</p>
		<a href="#get-started">Get started</a>
	</main>
</body>
</html>
